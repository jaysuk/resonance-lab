name: Release

# Cut a release:
#
#   npm run release -- 1.0.1 --push      # drafts release notes, bumps plugin.json+package.json, commits, tags, pushes
#
# The tag push runs the shared release workflow (jaysuk/dwc-plugin-workflows), which builds
# ResonanceLab-<version>.zip (and the DWC 3.6 ZIP, -dwc36, from src/ui36 via scripts/stage-dwc36.mjs) against DWC and publishes a Release with a pun title and
# generated notes. Run it by hand (Actions -> Release -> Run workflow) for a dry run: it builds the
# ZIPs as an artifact and shows the title and notes in the run summary, publishing nothing.
#
# Plugin-specific bits: scripts/release-titles.txt (the puns) and .github/release-footer.md (extra notes in
# the footer).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dwc-ref:
        description: DuetWebControl branch/tag/sha to build the DWC 3.7 package against
        default: v3.7-dev
      dwc36-ref:
        description: DuetWebControl branch/tag/sha to build the DWC 3.6 package against
        default: v3.6-dev

permissions:
  contents: write # the shared workflow creates the Release and uploads the assets

jobs:
  release:
    uses: jaysuk/dwc-plugin-workflows/.github/workflows/release.yml@v1
    with:
      dwc-ref: ${{ inputs.dwc-ref }}
      dwc36: true
      dwc36-ref: ${{ inputs.dwc36-ref }}
